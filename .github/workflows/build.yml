name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Download scary assets
        run: |
          mkdir -p app/src/main/res/drawable app/src/main/res/raw app/src/main/res/mipmap-hdpi
          curl -sL -o app/src/main/res/drawable/scary_face.png "https://clipart-library.com/images/pT5dRngkc.jpg" || true
          curl -sL -o app/src/main/res/raw/scare_sound.mp3 "https://orangefreesounds.com/wp-content/uploads/2024/07/Horror-scream-sound-effect.mp3" || true
          # fallback icon
          python3 -c "
from struct import pack
open('app/src/main/res/mipmap-hdpi/ic_launcher.png','wb').write(b'\x89PNG\r\n\x1a\n' + pack('>I',13) + b'IHDR' + pack('>IIBBBBB',48,48,8,2,0,0,0) + b'\x00'*20 + b'IEND\xaeB`\x82')
" || true
          ls -lh app/src/main/res/drawable/ app/src/main/res/raw/ || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build with Gradle
        run: |
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle.zip
          ./gradle-8.2/bin/gradle wrapper --gradle-version 8.2 || true
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace --no-daemon || ./gradle-8.2/bin/gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScareVirus-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            **/app-debug.apk
          if-no-files-found: warn
