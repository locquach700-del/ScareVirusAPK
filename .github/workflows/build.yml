name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download scary assets
        run: |
          mkdir -p app/src/main/res/drawable app/src/main/res/raw app/src/main/res/mipmap-hdpi
          # Scary face
          curl -sL -o app/src/main/res/drawable/scary_face.png "https://clipart-library.com/images/pT5dRngkc.jpg" || curl -sL -o app/src/main/res/drawable/scary_face.png "https://www.publicdomainpictures.net/pictures/370000/velka/image-1599417362z5n.jpg"
          # Horror sound
          curl -sL -o app/src/main/res/raw/scare_sound.mp3 "https://orangefreesounds.com/wp-content/uploads/2024/07/Horror-scream-sound-effect.mp3"
          # Simple red icon
          convert -size 192x192 xc:'#AA0000' app/src/main/res/mipmap-hdpi/ic_launcher.png || python3 -c "open('app/src/main/res/mipmap-hdpi/ic_launcher.png','wb').write(b'')"
          ls -lh app/src/main/res/drawable/ app/src/main/res/raw/

      - name: Grant execute for gradlew
        run: |
          if [ ! -f gradlew ]; then
            curl -sL -o gradle-8.2-bin.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
            unzip -q gradle-8.2-bin.zip
            /tmp/gradle-8.2/bin/gradle wrapper --gradle-version 8.2 || true
          fi
          chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties || true
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            # Fallback: use installed gradle if any
            gradle assembleDebug --stacktrace --no-daemon || echo "Build failed - check logs"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScareVirus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
