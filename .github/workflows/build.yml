name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools && cd $HOME/android-sdk/cmdline-tools
          curl -sL -o c.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q c.zip && mv cmdline-tools latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
      - name: Packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Assets
        run: |
          mkdir -p app/src/main/res/drawable app/src/main/res/raw
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi
          curl -sL -o /tmp/s1.jpg "https://www.publicdomainpictures.net/pictures/370000/velka/image-1599417362z5n.jpg"
          curl -sL -o /tmp/s2.jpg "https://www.publicdomainpictures.net/pictures/60000/velka/scary-skull.jpg"
          if [ -s /tmp/s1.jpg ]; then cp /tmp/s1.jpg app/src/main/res/drawable/scary_face.png
          else cp /tmp/s2.jpg app/src/main/res/drawable/scary_face.png; fi
          curl -sL -o app/src/main/res/raw/scare_sound.mp3 "https://orangefreesounds.com/wp-content/uploads/2024/07/Horror-scream-sound-effect.mp3"
          cp app/src/main/res/drawable/scary_face.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp app/src/main/res/drawable/scary_face.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp app/src/main/res/drawable/scary_face.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp app/src/main/res/drawable/scary_face.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          ls -lh app/src/main/res/drawable app/src/main/res/mipmap-hdpi
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Wrapper
        run: |
          curl -sL -o g.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q g.zip && ./gradle-8.2/bin/gradle wrapper --gradle-version 8.2 && chmod +x gradlew
      - run: ./gradlew assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ScareVirus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
