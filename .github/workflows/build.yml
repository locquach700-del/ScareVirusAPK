name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK manually
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -sL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip
          mv cmdline-tools latest
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Download assets + create icon
        run: |
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/raw
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi

          # Horror face (save as png even if source is jpg)
          curl -sL -o /tmp/face.jpg "https://clipart-library.com/images/pT5dRngkc.jpg"
          # convert if available, else just copy
          if command -v convert >/dev/null; then
            convert /tmp/face.jpg app/src/main/res/drawable/scary_face.png
          else
            cp /tmp/face.jpg app/src/main/res/drawable/scary_face.png
          fi

          # Horror sound
          curl -sL -o app/src/main/res/raw/scare_sound.mp3 \
            "https://orangefreesounds.com/wp-content/uploads/2024/07/Horror-scream-sound-effect.mp3"

          # Guaranteed valid red PNG icon using Python
          python3 - << 'PY'
import struct, zlib
def write_png(path, w, h, r=170, g=0, b=0):
    def chunk(tag, data):
        return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)
    raw = b""
    for y in range(h):
        raw += b"\x00" + bytes([r, g, b]) * w
    open(path, "wb").write(
        b"\x89PNG\r\n\x1a\n" +
        chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0)) +
        chunk(b"IDAT", zlib.compress(raw)) +
        chunk(b"IEND", b"")
    )
write_png("app/src/main/res/mipmap-hdpi/ic_launcher.png", 72, 72)
write_png("app/src/main/res/mipmap-mdpi/ic_launcher.png", 48, 48)
write_png("app/src/main/res/mipmap-xhdpi/ic_launcher.png", 96, 96)
print("icons created")
PY

          ls -lh app/src/main/res/drawable app/src/main/res/raw app/src/main/res/mipmap-hdpi

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Bootstrap Gradle Wrapper
        run: |
          curl -sL -o gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle.zip
          ./gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScareVirus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
